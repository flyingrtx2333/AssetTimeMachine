      - path: ../AssetTimeMachine/Models.swift
      - path: ../AssetTimeMachine/AppLanguage.swift
      - path: ../AssetTimeMachine/AppPreviewSession.swift
      - path: ../AssetTimeMachine/Services/BackgroundTaskWork.swift
      - path: ../AssetTimeMachine/Services/KeychainTokenStore.swift
      - path: ../AssetTimeMachine/Services/SnapshotService.swift
      - path: ../AssetTimeMachine/Services/PortfolioCalculator.swift
      - path: ../AssetTimeMachine/Services/PortfolioMetrics.swift
      - path: ../AssetTimeMachine/Services/TimeMachineSnapshotProjectionStore.swift
      - path: ../AssetTimeMachine/ImportExport.swift
      - path: ../AssetTimeMachine/CloudSync.swift
      - path: ../AssetTimeMachine/RemoteMarket.swift
      - path: ../AssetTimeMachine/MarketAssetCatalog.swift
      - path: ../AssetTimeMachine/Views/Shared/AppFormatters.swift
      - path: ../AssetTimeMachine/Services/AssetItemService.swift
      - path: ../AssetTimeMachine/AssetIconRegistry.swift
      - path: ../AssetTimeMachine/Backtest/BacktestCoreAliases.swift
      - path: ../AssetTimeMachine/Backtest/BacktestModels.swift
      - path: ../AssetTimeMachine/Backtest/BacktestEngine.swift
      - path: ../AssetTimeMachine/Backtest/BacktestRecordAdapter.swift
      - path: ../AssetTimeMachine/Backtest/AdvancedBacktestDataSupport.swift
      - path: ../AssetTimeMachine/Backtest/BacktestPresentation.swift
      - path: ../AssetTimeMachine/Backtest/StrategyAdviceService.swift
      - path: ../AssetTimeMachine/Backtest/StrategyAdviceProjectionStore.swift
